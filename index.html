<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>機房 3D</title>
  </head>
  <body>
    <div id="app"></div>

    <div id="toolbar" class="hud">
      <div class="hud-title"></div>
      <select id="site-select" class="hidden"></select>
      <div class="btn-row">
        <button data-view="persp">透視</button>
        <button data-view="top">俯視</button>
      </div>
      <label><input type="checkbox" data-layer="walls" checked /> 牆體 / 門</label>
      <label><input type="checkbox" data-layer="containment" checked /> 封閉通道頂板</label>
      <label><input type="checkbox" data-layer="sensors" checked /> 溫濕度感測器</label>
      <label><input type="checkbox" data-layer="cameras" checked /> 攝影機</label>
      <label><input type="checkbox" data-layer="power" /> 電力拓樸</label>
      <label><input type="checkbox" data-layer="heat" /> 溫度熱圖</label>
      <label><input type="checkbox" data-layer="airflow" /> 氣流</label>
      <label><input type="checkbox" data-layer="plan" /> 平面圖疊圖（比對用）</label>
    </div>

    <aside id="panel" class="hud hidden"></aside>
    <div id="power-legend" class="hud hidden">
      <div class="legend-row"><span class="swatch" style="background:#1d4ed8"></span>A 路主幹（UPS → PDC）</div>
      <div class="legend-row"><span class="swatch thin" style="background:#1d4ed8"></span>A 路分支（PDC → 機櫃）</div>
      <div class="legend-row"><span class="swatch" style="background:#ea580c"></span>B 路主幹</div>
      <div class="legend-row"><span class="swatch thin" style="background:#ea580c"></span>B 路分支</div>
      <div class="legend-row"><span class="swatch" style="background:#6b7280"></span>直流（電池）</div>
      <div class="legend-note">走線為示意；點選設備可追蹤上下游與備援</div>
      <button id="power-show-all" class="hidden">顯示全部（Esc）</button>
    </div>
    <div id="heat-legend" class="hud hidden">
      <div class="legend-title"></div>
      <div class="heat-bar"></div>
      <div class="heat-ticks"><span>15</span><span>20</span><span>25</span><span>30</span><span>35 °C</span></div>
      <div class="legend-note">感測器之間為內插估算，未考慮牆的阻隔；離感測器太遠處不顯示</div>
    </div>
    <div id="airflow-legend" class="hud hidden">
      <div class="legend-title">氣流（冷通道封閉）</div>
      <div class="heat-bar" style="background: linear-gradient(to right, #2563eb, #dc2626)"></div>
      <div class="heat-ticks"><span>冷風</span><span>熱風</span></div>
      <div class="legend-note">示意：列間空調把冷風送進封閉的冷通道，機櫃吸入後由背面排出，再回到空調後方。點選機櫃或空調可只看它的氣流。</div>
    </div>
    <div id="tooltip" class="hidden"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
