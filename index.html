<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>機房 3D</title>
  </head>
  <body>
    <div id="app"></div>

    <div id="toolbar" class="hud">
      <div class="hud-title"></div>
      <select id="site-select" class="hidden"></select>
      <div class="btn-row">
        <button data-view="persp">透視</button>
        <button data-view="top">俯視</button>
      </div>
      <label><input type="checkbox" data-layer="walls" checked /> 牆體 / 門</label>
      <label><input type="checkbox" data-layer="containment" checked /> 封閉通道頂板</label>
      <label><input type="checkbox" data-layer="sensors" checked /> 溫濕度感測器</label>
      <label><input type="checkbox" data-layer="cameras" checked /> 攝影機</label>
      <label><input type="checkbox" data-layer="power" /> 電力拓樸</label>
      <label><input type="checkbox" data-layer="plan" /> 平面圖疊圖（比對用）</label>
    </div>

    <aside id="panel" class="hud hidden"></aside>
    <div id="power-legend" class="hud hidden">
      <div class="legend-row"><span class="swatch" style="background:#1d4ed8"></span>A 路主幹（UPS → PDC）</div>
      <div class="legend-row"><span class="swatch thin" style="background:#93c5fd"></span>A 路分支（PDC → 機櫃）</div>
      <div class="legend-row"><span class="swatch" style="background:#ea580c"></span>B 路主幹</div>
      <div class="legend-row"><span class="swatch thin" style="background:#fdba74"></span>B 路分支</div>
      <div class="legend-row"><span class="swatch" style="background:#6b7280"></span>直流（電池）</div>
      <div class="legend-row"><span class="swatch" style="background:#eab308"></span>⚠ 單路，無備援</div>
      <div class="legend-note">走線為示意；點選設備可追蹤上下游與備援</div>
    </div>
    <div id="tooltip" class="hidden"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
